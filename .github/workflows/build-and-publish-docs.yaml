name: Build and publish documentation
on:
  workflow_dispatch:
  release:
    types:
      - published
env:
  PYTHON_VERSION: 3.x

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.0.0
        
      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1

      - name: Set up Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Set up build cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: mkdocs-material-${{ hashfiles('.cache/**') }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir mkdocs-material \
                                     mkdocs-literate-nav \
                                     mkdocs-redirects \
                                     mkdocs-material[recommended] \
                                     mkdocs-material[imaging] \
                                     mike

      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Extract short tag
        id: extract_short_tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          SHORT_TAG="$(echo "$TAG" | sed 's/\([0-9]*\.[0-9]*\).*/\1\.x/')"
          echo "SHORT_TAG=$SHORT_TAG" >> $GITHUB_OUTPUT

      - name: Deploy with mike 🚀
        # note that "mike set-default latest" was run manually in initial docs setup
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SHORT_TAG=${{ steps.extract_short_tag.outputs.SHORT_TAG }}
          mike deploy --update-aliases --push --branch=gh-pages "$SHORT_TAG" latest
          mike --version
          
      - name: Save build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs-material-${{ hashfiles('.cache/**') }}
          path: .cache
